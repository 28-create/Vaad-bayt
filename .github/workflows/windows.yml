name: Windows executable
on:
  push:
    branches: [main]
    tags:
      - 'release-*'
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install packager
        run: python -m pip install pyinstaller==6.22.3
      - name: Test and build executable
        run: .\Build.cmd
      - name: Upload Windows executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: VaadBayt-Windows
          path: dist/VaadBayt.exe
      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (gh release view $tag 2>$null) {
            gh release upload $tag dist/VaadBayt.exe --clobber
          } else {
            gh release create $tag dist/VaadBayt.exe --title "Vaad Bayt $tag (v3.1.0)" --generate-notes --latest
          }
