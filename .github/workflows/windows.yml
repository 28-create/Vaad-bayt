name: Windows executable
on:
  push:
    branches: [main]
    tags:
      - 'release-*'
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install packager
        run: python -m pip install pyinstaller==6.22.3
      - name: Test and build executable
        run: .\Build.cmd
      - name: Build Windows Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if (-not $iscc) {
            $candidates = @(
              "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
              "C:\Program Files\Inno Setup 6\ISCC.exe"
            )
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          $ver = python -c "from vaad.__version__ import __version__; print(__version__)"
          & $iscc "/DAppVersion=$ver" "installer\VaadBayt.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item dist\VaadBayt-Setup.exe | Select-Object Name, Length
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VaadBayt-Windows
          path: |
            dist/VaadBayt.exe
            dist/VaadBayt-Setup.exe
      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = python -c "from vaad.__version__ import __version__; print(__version__)"
          if (gh release view $tag 2>$null) {
            gh release upload $tag dist/VaadBayt-Setup.exe dist/VaadBayt.exe --clobber
          } else {
            gh release create $tag dist/VaadBayt-Setup.exe dist/VaadBayt.exe --title "Vaad Bayt $tag (v$ver)" --generate-notes --latest
          }
