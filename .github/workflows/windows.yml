name: Windows executable
on:
  push:
    branches: [main]
    paths:
      - 'vaad/**'
      - 'desktop.py'
      - 'Build.cmd'
      - 'VaadBayt.spec'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install packager
        run: python -m pip install pyinstaller==6.22.3
      - name: Test and build executable
        run: .\Build.cmd
      - name: Upload Windows executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: VaadBayt-Windows
          path: dist/VaadBayt.exe
