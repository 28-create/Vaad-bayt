name: Windows executable
on:
  push:
    branches: [main]
    paths:
      - 'vaad/**'
      - 'desktop.py'
      - 'Build.cmd'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Run financial tests
        run: python -m unittest discover -s tests -v
      - name: Install packager
        run: python -m pip install pyinstaller==6.22.3
      - name: Build executable
        run: .\Build.cmd
      - name: Publish executable in a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create phase-1 dist/VaadBayt.exe --title "Vaad Bayt phase 1" --notes "Windows desktop application, phase 1." --target "${{ github.sha }}" --latest
